# Giver Bing, Yandex, Seznam og Naver besked via IndexNow, hver gang hjemmesiden udgives.
name: IndexNow
on:
  push:
    branches: [main]
    paths: ['**.html', 'sitemap.xml', 'llms.txt']
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vent på GitHub Pages
        run: sleep 90
      - name: Send adresserne
        run: |
          KEY=$(ls | grep -E '^[0-9a-f]{32}\.txt$' | head -1 | sed 's/\.txt$//')
          URLS=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<[^>]*>//g' | jq -R . | jq -s -c '. + ["https://stemplerind.dk/llms.txt"]')
          BODY=$(jq -n -c --arg k "$KEY" --argjson u "$URLS" '{host:"stemplerind.dk",key:$k,keyLocation:("https://stemplerind.dk/"+$k+".txt"),urlList:$u}')
          curl -sS -o /dev/null -w "IndexNow: %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$BODY"
